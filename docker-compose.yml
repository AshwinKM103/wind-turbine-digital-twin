# Wind Turbine Digital Twin - full stack.
# All persistent state lives under ./data/ so containers are disposable.

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: turbine-zookeeper
    restart: unless-stopped
    user: "0"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./data/zookeeper/data:/var/lib/zookeeper/data
      - ./data/zookeeper/log:/var/lib/zookeeper/log
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: turbine-kafka
    restart: unless-stopped
    user: "0"
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Single-broker values; raise replication/ISR before adding brokers.
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 24h: bounds how long IoTDB can be down before the consumer cannot catch up.
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  iotdb:
    image: apache/iotdb:${IOTDB_VERSION:-1.3.3-standalone}
    container_name: iotdb
    restart: unless-stopped
    ports:
      - "6667:6667"   # session RPC
      - "18080:18080" # REST, used by the Grafana datasource
    environment:
      JAVA_OPT: "-Ddisk_space_warning_threshold=0.01"
    volumes:
      - ${IOTDB_DATA_PATH:-./data/iotdb/data}:/iotdb/data
      - ${IOTDB_LOGS_PATH:-./data/iotdb/logs}:/iotdb/logs
      - ./provisioning/iotdb/iotdb-system.properties:/iotdb/conf/iotdb-system.properties
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    build:
      context: ./provisioning
      dockerfile: Dockerfile.grafana
    image: turbine-grafana:latest
    container_name: turbine-grafana
    restart: unless-stopped
    depends_on:
      iotdb:
        condition: service_healthy
    user: "0"
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # Interpolated into provisioning/datasources/iotdb.yml at startup.
      - IOTDB_USER=${IOTDB_USER:-root}
      - IOTDB_PASSWORD=${IOTDB_PASSWORD:-root}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Per-customer orgs/dashboards are created by scripts/setup_grafana_orgs.py (API-driven).
      # Only iotdb.yml is file-provisioned (the datasource connection).
      - ./provisioning/dashboards/json:/var/lib/grafana/dashboards:ro
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # >>> BEGIN GENERATED TURBINE GENERATORS
