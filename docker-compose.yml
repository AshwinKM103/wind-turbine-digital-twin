# Wind Turbine Digital Twin - Unified Docker Compose (Phase 2)
#
# Deployment:
#   docker compose up -d
#
# All persistent state uses Docker named volumes.

services:

  # ========================================================================
  # BASE INFRASTRUCTURE
  # ========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: turbine-zookeeper
    restart: unless-stopped
    user: "0"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: turbine-kafka
    restart: unless-stopped
    user: "0"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:19092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: turbine-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT_HOST:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turbine}
      POSTGRES_USER: ${POSTGRES_USER:-turbine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD:?POSTGRES_GRAFANA_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./provisioning/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./app/config/postgres-schema.sql:/sql/postgres-schema.sql:ro
      - ./provisioning/postgres/tenant-views.sql:/sql/tenant-views.sql:ro
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turbine} -d ${POSTGRES_DB:-turbine} && psql -U ${POSTGRES_USER:-turbine} -d ${POSTGRES_DB:-turbine} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: turbine-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: turbine
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POOL_MODE: transaction
      LISTEN_PORT: 5432
    networks:
      - turbine-net

  iotdb:
    image: apache/iotdb:${IOTDB_VERSION:-1.3.3-standalone}
    container_name: iotdb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2.5G'
        reservations:
          cpus: '1.0'
          memory: '1G'
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6667:6667"
      - "${BIND_ADDR:-127.0.0.1}:18080:18080"
    environment:
      - DATANODE_MEMORY_SIZE=1200M
      - CONFIGNODE_MEMORY_SIZE=512M
    volumes:
      - iotdb-data:/iotdb/data
      - iotdb-logs:/iotdb/logs
      - ./provisioning/iotdb/iotdb-system.properties:/iotdb/conf/iotdb-system.properties
      - ./provisioning/iotdb/datanode-env.sh:/iotdb/conf/datanode-env.sh
      - ./provisioning/iotdb/confignode-env.sh:/iotdb/conf/confignode-env.sh
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ========================================================================
  # OPENBAO - SECRETS MANAGER
  # ========================================================================
  # One-shot: Docker creates named volumes and bind-mount dirs root-owned, but
  # openbao runs as uid 100, tb-node as 799, and the provisioner as the host
  # user -- each would fail on first write without this chown.
  bootstrap-permissions:
    image: busybox
    container_name: bootstrap-permissions
    restart: "no"
    command:
      - sh
      - -c
      - |
        chown -R 100:1000 /openbao/data /openbao/logs
        chown -R 799:799 /tb-data
        chown -R "${HOST_UID:-1000}:${HOST_GID:-1000}" /secrets /provisioning
    volumes:
      - openbao-data:/openbao/data
      - openbao-logs:/openbao/logs
      - tb-data:/tb-data
      - ${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/secrets:/secrets
      - ${PROVISIONING_OUTPUT:-${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/provisioning-results}:/provisioning

  openbao:
    image: openbao/openbao:latest
    container_name: turbine-openbao
    restart: unless-stopped
    command: ["server"]
    depends_on:
      bootstrap-permissions:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8200:8200"
    environment:
      BAO_LOG_LEVEL: info
      BAO_LOCAL_CONFIG: |
        storage "raft" {
          path = "/openbao/data"
          node_id = "raft_node_1"
        }
        listener "tcp" {
          address = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr = "http://127.0.0.1:8200"
        cluster_addr = "http://127.0.0.1:8201"
        disable_mlock = true
        ui = true
    volumes:
      - openbao-data:/openbao/data
      - openbao-logs:/openbao/logs
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: initialize/unseal OpenBao and register policies (idempotent)
  openbao-setup:
    build:
      context: ./openbao
      dockerfile: Dockerfile
    container_name: openbao-setup
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      bootstrap-permissions:
        condition: service_completed_successfully
      openbao:
        condition: service_started
    environment:
      OPENBAO_ADDR: http://openbao:8200
      HOME: /tmp
    volumes:
      - ./openbao:/workspace/openbao:ro
      - ${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/secrets:/workspace/secrets
    working_dir: /workspace
    networks:
      - turbine-net
    entrypoint: ["bash", "openbao/init-openbao.sh"]

  # NOTE: the synthetic telemetry generator (synthetic_producer.py) that used
  # to run here has been removed. It produced a second, fake 1 Hz stream onto
  # the same Kafka topic as replay-server's real NI DAQ CSV replay, silently
  # overwriting/competing with the real data every dashboard is supposed to
  # show. replay-server (below) is now the single source of live telemetry,
  # replaying data/daq_test_log_normalized_1hz.csv at 1 Hz directly to Kafka.

  consumer:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: turbine-digitaltwin-app:latest
    container_name: turbine-consumer
    restart: unless-stopped
    command: ["python", "kafka_consumer.py"]
    depends_on:
      kafka:
        condition: service_healthy
      iotdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS_INTERNAL=kafka:29092
      - IOTDB_HOST=iotdb
      - IOTDB_PORT=6667
      - LOG_DIR=/app/logs
      - HEALTH_CHECK_PORT=8001
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8001"
    volumes:
      - app-services-logs:/app/logs
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================================================
  # THINGSBOARD
  # ========================================================================

  thingsboard-postgres:
    image: postgres:15-alpine
    container_name: thingsboard-postgres
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${TB_POSTGRES_PORT_HOST:-15433}:5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: thingsboard
      POSTGRES_PASSWORD: ${TB_POSTGRES_PASSWORD:?TB_POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - thingsboard-postgres-data:/var/lib/postgresql/data
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thingsboard -d thingsboard && psql -U thingsboard -d thingsboard -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: tb-node refuses to start against an uninstalled schema, and its
  # installer is not itself idempotent -- the marker file on the persistent
  # volume is what keeps `docker compose up` from re-running it.
  thingsboard-install:
    image: thingsboard/tb-node:latest
    container_name: thingsboard-install
    restart: "no"
    depends_on:
      bootstrap-permissions:
        condition: service_completed_successfully
      thingsboard-postgres:
        condition: service_healthy
    environment:
      DATABASE_TS_TYPE: sql
      SPRING_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: thingsboard
      SPRING_DATASOURCE_PASSWORD: ${TB_POSTGRES_PASSWORD:?TB_POSTGRES_PASSWORD must be set in .env}
      INSTALL_TB: "true"
      LOAD_DEMO: "false"
    volumes:
      - tb-data:/data/tb-core
    networks:
      - turbine-net
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ -f /data/tb-core/.installed ]; then
          echo "Thingsboard already installed, skipping."
        else
          ( start-tb-node.sh )
          touch /data/tb-core/.installed
        fi

  thingsboard:
    image: thingsboard/tb-node:latest
    container_name: thingsboard
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '2G'
        reservations:
          cpus: '1.0'
          memory: '1G'
    depends_on:
      thingsboard-postgres:
        condition: service_healthy
      thingsboard-install:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8080"
    environment:
      JAVA_OPTS: >-
        -Xms1024m
        -Xmx1536m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ParallelRefProcEnabled
      TB_QUEUE_TYPE: in-memory
      DATABASE_TS_TYPE: sql
      SPRING_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: thingsboard
      SPRING_DATASOURCE_PASSWORD: ${TB_POSTGRES_PASSWORD:?TB_POSTGRES_PASSWORD must be set in .env}
      MQTT_ENABLED: "true"
      MQTT_BIND_ADDRESS: 0.0.0.0
      MQTT_BIND_PORT: 1883
      MQTT_MSG_QUEUE_SIZE_PER_DEVICE_LIMIT: "1000"
      NETTY_LEAK_DETECTOR_LVL: DISABLED
      CACHE_TYPE: caffeine
    volumes:
      - tb-data:/data/tb-core
      - tb-logs:/var/log/thingsboard
    networks:
      - turbine-net
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.mqtt.entrypoints=mqtt"
      - "traefik.tcp.routers.mqtt.rule=HostSNI(`*`)"
      - "traefik.tcp.services.mqtt.loadbalancer.server.port=1883"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /api/auth/user HTTP/1.0\\r\\n\\r\\n\" >&3 && head -c 12 <&3 | grep -qE \"HTTP/1.[01] (200|401|403)\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # One-shot: provisions tenants/devices from fleet.json, then exports the
  # device token map the bridge needs. Runs on every `up` because that map is
  # not in git and its tokens are only valid for the devices currently in
  # Thingsboard; both steps are idempotent.
  # One-shot: rotates Thingsboard's sysadmin password away from the OSS
  # image's fixed install default (sysadmin@thingsboard.org/sysadmin) to
  # TB_SYSADMIN_PASSWORD. Idempotent -- a no-op once already rotated.
  thingsboard-secure-admin:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: turbine-digitaltwin-app:latest
    container_name: thingsboard-secure-admin
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      thingsboard:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TB_HOST: thingsboard
      TB_PORT: "8080"
    entrypoint: ["python", "/app/tools/thingsboard_admin.py", "auth", "secure"]
    volumes:
      - ./app/tools:/app/tools:ro
    networks:
      - turbine-net

  token-exporter:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: turbine-digitaltwin-app:latest
    container_name: token-exporter
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - .env
    environment:
      TB_HOST: thingsboard
      TB_PORT: "8080"
      # Must match the bridge's TB_DEVICE_TOKEN_MAP below: writer and reader
      # resolve the same file, so a rotated token cannot go unnoticed.
      TB_DEVICE_TOKEN_MAP: /app/provisioning/device-tokens.json
    entrypoint: ["python", "/app/tools/thingsboard_admin.py", "auth", "export-tokens"]
    volumes:
      - ./app/tools:/app/tools:ro
      - ${PROVISIONING_OUTPUT:-${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/provisioning-results}:/app/provisioning
    networks:
      - turbine-net

  # ========================================================================
  # DAQ REPLAY CONTROL API (serves the dashboard time-scrubber widget)
  # ========================================================================
  # --serve-only: exposes the seek/report endpoints backed by the recorded DAQ
  # CSV without producing to Kafka. The replay path publishes under the same
  # zephyr-energy/cascade-ridge/boreas identity as the synthetic generator, so
  # letting it produce here would put a second 1 Hz stream on the same turbine.
  #
  # The script resolves its data and report directories relative to a repo root
  # that is "/" inside this image, hence the top-level mount points.
  replay-server:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: turbine-digitaltwin-app:latest
    container_name: replay-server
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      kafka:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
    env_file:
      - .env
    command:
      - python
      - /app/tools/replay_daq_to_kafka.py
      - --bootstrap-servers
      - kafka:29092
      - --tb-host
      - thingsboard
      - --tb-port
      - "8080"
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./app/tools:/app/tools:ro
      - ./data:/data:ro
      - ${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/reports:/reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/api/replay/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - turbine-net

  # ========================================================================
  # KAFKA-MQTT BRIDGE (Kafka → Thingsboard MQTT)
  # ========================================================================
  kafka-mqtt-bridge:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: turbine-digitaltwin-app:latest
    container_name: kafka-mqtt-bridge
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '512M'
    command: ["python", "kafka_mqtt_bridge.py"]
    depends_on:
      kafka:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      token-exporter:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS_INTERNAL=kafka:29092
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_MQTT:-kafka-mqtt-bridge-group}
      - MQTT_HOST=thingsboard
      - MQTT_PORT=1883
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${BRIDGE_LOG_LEVEL:-INFO}
      - HEALTH_CHECK_PORT=8003
      - BATCH_SIZE=${BATCH_SIZE:-50}
      - BATCH_MAX_WAIT_S=${BATCH_MAX_WAIT_S:-5.0}
      - TB_DEVICE_TOKEN_MAP=/app/provisioning/device-tokens.json
    volumes:
      - app-bridge-logs:/app/logs
      - ${PROVISIONING_OUTPUT:-${STORAGE_PATH:-/mnt/data3/turbine-digitaltwin}/provisioning-results}:/app/provisioning:ro
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8003/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========================================================================
  # LOCAL LLM (VLLM) - Inference Engine
  # ========================================================================
  vllm:
    # Pinned below :latest: :latest ships a CUDA 13.0 build of PyTorch, which
    # this host's NVIDIA driver (565.57.01, max CUDA 12.7) cannot run
    # ("Error 804: forward compatibility was attempted on non supported HW").
    # v0.8.5.post1 ships CUDA 12.4, which the driver supports.
    image: vllm/vllm-openai:v0.8.5.post1
    container_name: vllm
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU_ID:-1}"]
              capabilities: [gpu]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set in .env}
      MODEL_NAME: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - --api-key
      - ${VLLM_API_KEY:?VLLM_API_KEY must be set in .env}
      - --port
      - "8000"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --gpu-memory-utilization
      - "0.85"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    networks:
      - turbine-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ========================================================================
  # COPILOT BACKEND - LLM-Powered Turbine Assistant
  # ========================================================================
  copilot-backend:
    build:
      context: .
      dockerfile: app/copilot_backend/Dockerfile
    container_name: copilot-backend
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY must be set in .env}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      TB_HOST: thingsboard
      TB_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-turbine}
      POSTGRES_USER: ${POSTGRES_USER:-turbine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8090:8090"
    networks:
      - turbine-net

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.mqtt.address=:8883"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8080"
      - "${BIND_ADDR:-127.0.0.1}:8883:8883"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - turbine-net

networks:
  turbine-net:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  postgres-data:
  iotdb-data:
  iotdb-logs:
  openbao-data:
  openbao-logs:
  thingsboard-postgres-data:
  tb-data:
  tb-logs:
  app-services-logs:
  app-bridge-logs:
  vllm-hf-cache:


