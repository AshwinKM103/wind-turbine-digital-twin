name: Babylon 3D Widget Regression Suite

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/thingsboard/widgets/turbine-3d-babylon.js'
      - 'app/thingsboard/widgets/turbine-3d-babylon.widget-type.json'
      - 'tests/**'
      - '.github/workflows/babylon-widget-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/thingsboard/widgets/turbine-3d-babylon.js'
      - 'app/thingsboard/widgets/turbine-3d-babylon.widget-type.json'
      - 'tests/**'
      - '.github/workflows/babylon-widget-tests.yml'

jobs:
  test:
    name: Playwright Babylon Widget Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Regression Tests
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
