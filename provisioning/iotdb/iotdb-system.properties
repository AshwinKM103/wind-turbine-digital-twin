#
# Custom iotdb-system.properties, bind-mounted over the image's baked-in
# copy at /iotdb/conf/iotdb-system.properties.
#
# This file is the sole source of truth for IoTDB configuration.
# Environment variables set on the iotdb service in docker-compose.yml do
# not take effect.
#
# This file provides:
# - REST API config (enable_rest_service=true, rest_service_port=18080)
# - Cluster topology (cn_* and dn_* settings for single-node standby mode)
# - Replication policy and prometheus metrics
#

####################
### Cluster Configuration
####################

cluster_name=defaultCluster

####################
### Seed ConfigNode
####################

cn_seed_config_node=iotdb:10710

dn_seed_config_node=iotdb:10710

####################
### Node RPC Configuration
####################

cn_internal_address=iotdb
cn_internal_port=10710
cn_consensus_port=10720

dn_rpc_address=0.0.0.0
dn_rpc_port=6667
dn_internal_address=iotdb
dn_internal_port=10730
dn_mpp_data_exchange_port=10740
dn_schema_region_consensus_port=10750
dn_data_region_consensus_port=10760

####################
### Replication configuration
####################

schema_replication_factor=1
data_replication_factor=1

####################
### Directory Configuration
####################

# dn_data_dirs=data/datanode/data
# dn_wal_dirs=data/datanode/wal

####################
### Metric Configuration
####################

# cn_metric_reporter_list=
cn_metric_prometheus_reporter_port=9091

# dn_metric_reporter_list=
dn_metric_prometheus_reporter_port=9092

####################
### REST Service Configuration
####################

enable_rest_service=true
rest_service_port=18080

####################
### Disk Space Configuration
####################

disk_space_warning_threshold=0.02
